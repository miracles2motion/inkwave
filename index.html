<style>
  /* touch-action: none is a prerequisite, not polish: Android Chrome ignores user-scalable=no, so without it the second
     finger of a look+fire gesture is read as a pinch and BOTH pointers get cancelled. overscroll-behavior stops a
     downward drag near the top from turning into pull-to-refresh mid-round. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d1020;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }
  #app, #app canvas, #ui-root {
    position: fixed;
    inset: 0;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui-root { pointer-events: none; z-index: 10; }
  #fade { position: fixed; inset: 0; background: #0d1020; opacity: 1; pointer-events: all; z-index: 50; transition: opacity 600ms ease; }
  /* Wide enough to read on a phone, scrollable so a long message is never clipped, and selectable so the text can be
     copied off the device. */
  #boot-error { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 60; color: #fff;
    font: 600 15px/1.45 system-ui, sans-serif; background: #c0263d; padding: 18px 20px; border-radius: 12px;
    width: min(88vw, 560px); max-height: 72vh; overflow: auto; word-break: break-word;
    user-select: text; -webkit-user-select: text; box-shadow: 0 12px 40px rgba(0, 0, 0, .55); }

  /* Rotate Device to Landscape Overlay (Phase 1) */

  @media (orientation: portrait) {
    html.is-mobile-touch #rotate-device-overlay,
    body.is-mobile-touch #rotate-device-overlay,
    #rotate-device-overlay.is-visible {
      display: flex;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(13, 16, 32, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      box-sizing: border-box;
      pointer-events: all;
      user-select: none;

    font: 900 clamp(20px, 5.5vmin, 28px) / 1.15 'Rubik', system-ui, sans-serif;
    color: #ffffff;

    65%, 100% { transform: rotate(90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .iw-rotate-overlay__icon { animation: none; transform: rotate(90deg); }
  }

<div id="app"></div>

<script>
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  (function() {
    function checkMobile() {
      var ua = navigator.userAgent || '';
      var hasTouch = (navigator.maxTouchPoints || 0) > 0;
      var isIPad = (navigator.platform === 'MacIntel' || /iPad/i.test(ua)) && hasTouch;
      var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet/i.test(ua)
        || Boolean(navigator.userAgentData && navigator.userAgentData.mobile)
        || isIPad;
      if (window._dynamicTouchDetected || isMobileUA) return true;
      var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var isMobileViewport = Math.min(window.innerWidth, window.innerHeight) <= 768 || window.innerWidth <= 768;
      return Boolean(isCoarse && hasTouch && isMobileViewport);
    }
    if (checkMobile()) {
      document.documentElement.classList.add('is-mobile-touch');
    }
    function onFirstTouch() {
      window._dynamicTouchDetected = true;
      document.documentElement.classList.add('is-mobile-touch');
      window.removeEventListener('touchstart', onFirstTouch, true);
    }
    window.addEventListener('touchstart', onFirstTouch, { capture: true, passive: true });
  })();

  // fade in once the loading screen is mounted
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => { const f = document.getElementById('fade'); if (f) { f.style.opacity = '0'; f.style.pointerEvents = 'none'; } }, 60));

  // Remote error beacon. A phone has no console you can attach, so a failure there is otherwise invisible — and the
  // red box below can be missed or covered. A fire-and-forget GET to a path that cannot exist lands in the dev
  // server's log (tools/serve.py logs every 4xx together with its path), which is enough to diagnose the device from
  // the machine serving it. Deliberately in index.html rather than main.js: this way it also catches a failure while
  // the module itself is still loading.
  // Only on a host where a dev server is actually listening for it. The beacon works by requesting a path that cannot
  // exist and relying on tools/serve.py logging every 4xx — on a public host that is just a wasted request and a red
  // console line on every load. `?beacon` forces it on for a device test against a real deployment.
  const BEACON_ON = (() => {
    try {
      const h = location.hostname;
      if (new URLSearchParams(location.search).has('beacon')) return true;
      return h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h.endsWith('.local')
        || /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h);
    } catch (e) { return false; }
  })();
  window.__beacon = (kind, msg) => {
    if (!BEACON_ON) return;
    // Truncate BEFORE encoding: percent-encoding inflates a stack trace roughly threefold, so slicing the encoded
    // form (as this first did) cut it to a third of the intended length.
    try { fetch('/__inkwave_error/' + encodeURIComponent((kind + ': ' + String(msg)).slice(0, 1800))).catch(() => {}); } catch (e) { /* give up quietly */ }
  };
  window.addEventListener('error', (e) => { if (e && e.message) window.__beacon('error', e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || 0)); });
  window.addEventListener('unhandledrejection', (e) => window.__beacon('rejection', (e && e.reason && e.reason.message) || String(e && e.reason)));
</script>
